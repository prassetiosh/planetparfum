<style>

<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+(+n||0).toLocaleString('id-ID'),now=()=>new Date().toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const F={
bibit:{t:'Data Bibit Parfum',p:'BB',u:'ml',f:[['kode','Kode Bibit','t',1],['brand','Brand Produk','t',1],['nama','Nama Produk','t',1],['inspired','Inspired By','t'],['kategori','Kategori','x'],['gender','Gender','s',1,['Unisex','Pria','Wanita']],['notes','Notes (dari Inspired By)','a'],['stok','Stok Tersedia (ml)','n',1],['min','Batas Minimal (ml)','n',1],['harga','Harga Modal/ml','m',1],['total','Total Modal','c'],['lokasi','Lokasi Barang','t'],['upd','Update Date','d'],['ket','Keterangan','a']]},
kemasan:{t:'Data Barang Kemasan',p:'KM',u:'pcs',f:[['kode','Kode Barang','t',1],['nama','Nama Kemasan','t',1],['model','Model Kemasan','t'],['ukuran','Ukuran','t'],['warna','Warna / Spek','t'],['stok','Stok Tersedia','n',1],['min','Batas Minimal','n',1],['harga','Harga Modal','m',1],['total','Total Modal','c'],['lokasi','Lokasi Barang','t'],['upd','Update Date','d'],['ket','Keterangan','a']]},
mitra:{t:'Pelanggan & Pemasok',p:'MT',f:[['kode','Kode','t',1],['nama','Nama Pelanggan / Pemasok','t',1],['status','Status','s',1,['Pelanggan','Pemasok']],['kategori','Kategori','t'],['alamat','Alamat','a'],['telp','No. Telepon','t'],['pic','PIC','t'],['ket','Keterangan','a']]},
users:{t:'Management Admin',p:'U',f:[['id','ID User','t',1],['nama','Nama','t',1],['akses','Akses / Posisi','s',1,['Admin','Staf Gudang','Pimpinan']],['hp','No. Phone','t'],['pw','Password','t',1]]}};
const NOTES={'baccarat rouge':'Top: Saffron, Jasmine | Heart: Amberwood, Ambergris | Base: Fir Resin, Cedar','aventus':'Top: Blackcurrant, Apple, Bergamot | Heart: Birch, Rose | Base: Musk, Oakmoss, Ambergris','sauvage':'Top: Bergamot, Pepper | Heart: Lavender, Geranium | Base: Ambroxan, Cedar','bleu de chanel':'Top: Citrus, Mint | Heart: Ginger, Jasmine | Base: Sandalwood, Cedar, Incense','black opium':'Top: Pear, Pink Pepper | Heart: Coffee, Jasmine | Base: Vanilla, Patchouli','libre':'Top: Lavender, Mandarin | Heart: Orange Blossom, Jasmine | Base: Vanilla, Musk'};
const key=m=>F[m].f[0][0];
function seed(){return{bibit:[{kode:'BB001',brand:'Maison X',nama:'Rouge 540',inspired:'Baccarat Rouge 540',kategori:'Standar',gender:'Unisex',notes:NOTES['baccarat rouge'],stok:500,min:100,harga:2500,lokasi:'Rak A1',upd:now(),ket:''}],kemasan:[{kode:'KM001',nama:'Botol Spray',model:'Slim',ukuran:'30 ml',warna:'Bening',stok:200,min:50,harga:3500,lokasi:'Rak B1',upd:now(),ket:''}],mitra:[{kode:'MT001',nama:'Toko Wangi',status:'Pelanggan',kategori:'Retail',alamat:'',telp:'',pic:'',ket:''}],users:[{id:'admin',nama:'Administrator',akses:'Admin',hp:'',pw:'admin123'}],log:[]}}
let DB;try{DB=JSON.parse(localStorage.getItem('v91'))}catch(e){}DB=DB||seed();DB.opts=DB.opts||{kategori:['Standar','Premium','Gold']};
const save=()=>{try{localStorage.setItem('v91',JSON.stringify(DB))}catch(e){};syncSoon()};
let U=null,PG='home',S={},T={tipe:'masuk',items:[],mitra:'',cat:''},LF={},RF={};
const val=(m,r,k)=>k=='total'?r.stok*r.harga:r[k];
const fmt=(f,v)=>f[2]=='m'||f[2]=='c'?rp(v):v;
// popup
function pop(msg,ok,cancel,title){$('#m').innerHTML=`<div class="box"><h3 style="margin-top:0">${title||'Informasi'}</h3><div>${msg}</div><div class="row">${cancel?'<button id="pc">Batal</button>':''}<button class="p" id="po">OK</button></div></div>`;$('#m').classList.add('on');$('#po').onclick=()=>{cl();ok&&ok()};if(cancel)$('#pc').onclick=cl}
const cl=()=>{$('#m').classList.remove('on');$('#m').innerHTML=''};
function modal(h){$('#m').innerHTML=`<div class="box">${h}</div>`;$('#m').classList.add('on')}
// print
function doPrint(html,o){$('#pa').innerHTML=html;let s=$('#ps')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'ps'}));s.textContent=`@page{size:A4 ${o};margin:12mm}`;setTimeout(()=>window.print(),100)}
function printDlg(title,cols,rows,sum){const o=cols.length>7?'landscape':'portrait';
modal(`<h3 style="margin-top:0">Cetak PDF: ${title}</h3><label>Pilih kolom yang ditampilkan</label>${cols.map((c,i)=>`<label style="color:var(--t);margin:2px 0"><input type="checkbox" class="ck" value="${i}" checked style="width:auto"> ${c}</label>`).join('')}<label>Orientasi kertas</label><select id="or"><option value="portrait" ${o=='portrait'?'selected':''}>Portrait</option><option value="landscape" ${o=='landscape'?'selected':''}>Landscape</option></select><div class="row"><button onclick="cl()">Batal</button><button class="p" id="go">Cetak / Simpan PDF</button></div>`);
$('#go').onclick=()=>{const ix=[...document.querySelectorAll('.ck:checked')].map(x=>+x.value);if(!ix.length)return pop('Pilih minimal satu kolom.');const or=$('#or').value;cl();if(window.jspdf)return pdfGo(title,ix.map(i=>cols[i]),rows.map(r=>ix.map(i=>String(r[i]??''))),or,sum);
doPrint(`<h2 style="margin:0">V91.StokOrd</h2><h3 style="margin:2px 0">${title}</h3><small>Dicetak: ${now()} oleh ${esc(U.nama)}</small>${sum||''}<table style="width:100%;border-collapse:collapse;margin-top:8px"><thead><tr>${ix.map(i=>`<th>${cols[i]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${ix.map(i=>`<td>${esc(r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`,or)}}
// login/app
function login(){$('#app').innerHTML=`<div id="login"><h1>V91.<b>StokOrd</b></h1><div style="color:var(--m)">Stok bibit parfum & kemasan</div><label>ID User</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><div class="row"><button class="p" style="width:100%" id="lb">Masuk</button></div><p style="color:var(--m);font-size:12px">Akun awal: admin / admin123</p></div>`;
$('#lb').onclick=()=>{const u=DB.users.find(x=>x.id==$('#lu').value.trim()&&x.pw==$('#lp').value);u?(U=u,PG='home',shell()):pop('ID user atau password salah. Periksa kembali.')}}
const NAV=[['home','Menu Utama'],['bibit','Bibit'],['kemasan','Kemasan'],['mitra','Pelanggan/Pemasok'],['trx','Barang Masuk/Keluar'],['log','Log'],['lap','Laporan'],['users','Admin'],['xl','Ekspor/Impor'],['sy','Sinkronisasi']];
function shell(){const nv=NAV.filter(n=>!['users','xl','sy'].includes(n[0])||U.akses=='Admin');$('#app').innerHTML=`<nav>${nv.map(n=>`<button data-p="${n[0]}" class="${n[0]==PG?'on':''}">${n[1]}</button>`).join('')}<button class="d" id="lo">Keluar</button><span id="sb" style="margin-left:auto;align-self:center;font-size:12px;color:var(--m);white-space:nowrap"></span></nav><main id="mn"></main>`;
setSB();document.querySelectorAll('nav [data-p]').forEach(b=>b.onclick=()=>{PG=b.dataset.p;shell()});$('#lo').onclick=()=>{U=null;login()};({home,trx,log:logPg,lap,xl,sy:syPg}[PG]||(()=>crud(PG)))()}
function home(){const b=DB.bibit,k=DB.kemasan,low=[...b.map(x=>({...x,j:'Bibit',u:'ml'})),...k.map(x=>({...x,j:'Kemasan',u:'pcs'}))].filter(x=>x.stok<=x.min);
$('#mn').innerHTML=`<h1>V91.<b>StokOrd</b></h1><p style="color:var(--m)">Halo, ${esc(U.nama)} (${U.akses}). Ringkasan stok:</p><div class="cards"><div class="cd"><small>Jenis bibit</small><div>${b.length}</div></div><div class="cd"><small>Total bibit (ml)</small><div>${b.reduce((a,x)=>a+x.stok,0).toLocaleString('id-ID')}</div></div><div class="cd"><small>Modal bibit</small><div>${rp(b.reduce((a,x)=>a+x.stok*x.harga,0))}</div></div><div class="cd"><small>Jenis kemasan</small><div>${k.length}</div></div><div class="cd"><small>Modal kemasan</small><div>${rp(k.reduce((a,x)=>a+x.stok*x.harga,0))}</div></div><div class="cd"><small>Stok menipis</small><div style="color:var(--r)">${low.length}</div></div></div><h3>Stok di bawah batas minimal</h3><div class="w"><table><tr><th>Kode</th><th>Jenis</th><th>Nama</th><th>Stok</th><th>Minimal</th></tr>${low.map(x=>`<tr class="low"><td>${x.kode}</td><td>${x.j}</td><td>${esc(x.nama)}</td><td>${x.stok} ${x.u}</td><td>${x.min}</td></tr>`).join('')||'<tr><td colspan=5>Semua stok aman.</td></tr>'}</table></div>`}
// CRUD
function crud(m){const c=F[m],s=S[m]=S[m]||{q:'',fc:'',fv:''},cols=c.f.map(f=>f[1]);const act=m=='bibit'||m=='kemasan';
$('#mn').innerHTML=`<h2>${c.t}</h2><div class="tb"><input id="q" placeholder="Cari..." value="${esc(s.q)}"><select id="fc"><option value="">Filter kolom...</option>${c.f.filter(f=>f[2]!='a').map(f=>`<option value="${f[0]}" ${s.fc==f[0]?'selected':''}>${f[1]}</option>`).join('')}</select><select id="fv"></select><button class="p" id="ad">+ Tambah</button>${act?'<button id="bm">Edit Massal</button>':''}<button id="pr">Cetak PDF</button></div><div class="w" id="tw"></div>`;
const fvs=()=>{const k=$('#fc').value;$('#fv').innerHTML='<option value="">Semua nilai</option>'+(k?[...new Set(DB[m].map(r=>val(m,r,k)))].map(v=>`<option ${s.fv==v?'selected':''}>${esc(v)}</option>`).join(''):'')};
const rows=()=>DB[m].filter(r=>(!s.q||c.f.some(f=>String(val(m,r,f[0])).toLowerCase().includes(s.q.toLowerCase())))&&(!s.fc||!s.fv||String(val(m,r,s.fc))==s.fv));
const draw=()=>{const R=rows();$('#tw').innerHTML=`<table><thead><tr>${c.f.map(f=>`<th>${f[1]}</th>`).join('')}<th>${act?'Mutasi & Aksi':'Aksi'}</th></tr></thead><tbody>${R.map(r=>`<tr class="${act&&r.stok<=r.min?'low':''}">${c.f.map(f=>`<td class="${'nmc'.includes(f[2])?'n':''}">${esc(fmt(f,val(m,r,f[0])))}</td>`).join('')}<td style="white-space:nowrap">${act?`<button data-a="mu" data-k="${r[key(m)]}">Mutasi</button> `:''}<button data-a="ed" data-k="${r[key(m)]}">Edit</button> <button class="d" data-a="de" data-k="${r[key(m)]}">Hapus</button></td></tr>`).join('')||`<tr><td colspan=${c.f.length+1}>Data tidak ditemukan.</td></tr>`}</tbody></table>`;
document.querySelectorAll('#tw [data-a]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,a=b.dataset.a;if(a=='ed')form(m,k);if(a=='mu'){T.pre=k;PG='trx';shell()}if(a=='de')pop(`Hapus data <b>${esc(k)}</b>? Tindakan ini tidak dapat dibatalkan.`,()=>{DB[m]=DB[m].filter(r=>r[key(m)]!=k);save();pop('Data berhasil dihapus.',()=>crud(m))},1,'Verifikasi Hapus')})};
fvs();draw();$('#q').oninput=e=>{s.q=e.target.value;draw()};$('#fc').onchange=e=>{s.fc=e.target.value;s.fv='';fvs();draw()};$('#fv').onchange=e=>{s.fv=e.target.value;draw()};$('#ad').onclick=()=>form(m);if(act)$('#bm').onclick=()=>bulk(m,rows());
$('#pr').onclick=()=>printDlg(c.t,cols,rows().map(r=>c.f.map(f=>fmt(f,val(m,r,f[0])))))}
function form(m,k){const c=F[m],e=k?DB[m].find(r=>r[key(m)]==k):null,d=e||{};if(!e)d[key(m)]=c.p+String(DB[m].length+1).padStart(3,'0');
modal(`<h3 style="margin-top:0">${e?'Edit':'Tambah'} ${c.t}</h3>`+c.f.filter(f=>'cd'.indexOf(f[2])<0).map(f=>`<label>${f[1]}${f[3]?' *':''}</label>`+(f[2]=='a'?`<textarea id="f_${f[0]}" rows=2>${esc(d[f[0]])}</textarea>`:f[2]=='x'?`<select id="f_${f[0]}" onchange="$('#kn').style.display=this.value=='__new'?'block':'none'">${[...new Set([...DB.opts.kategori,d[f[0]]].filter(Boolean))].map(o=>`<option ${d[f[0]]==o?'selected':''}>${esc(o)}</option>`).join('')}<option value="__new">+ Tambah kategori baru...</option></select><input id="kn" placeholder="Nama kategori baru" style="display:none;margin-top:4px">`:f[2]=='s'?`<select id="f_${f[0]}">${f[4].map(o=>`<option ${d[f[0]]==o?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${f[0]}" ${'nm'.includes(f[2])?'type=number min=0':''} value="${esc(d[f[0]]??'')}" ${f[0]==key(m)&&e?'readonly':''}>`)+(f[0]=='notes'?'<button id="ai" style="margin-top:4px">✨ Isi notes otomatis dari Inspired By</button>':'')).join('')+`<div class="row"><button onclick="cl()">Batal</button><button class="p" id="sv">Simpan</button></div>`);
if($('#ai'))$('#ai').onclick=()=>{const q=$('#f_inspired').value.toLowerCase(),h=Object.keys(NOTES).find(x=>q.includes(x));h?$('#f_notes').value=NOTES[h]:pop('Notes untuk parfum ini belum ada di database bawaan. Silakan isi manual.')};
$('#sv').onclick=()=>{const n={},er=[];let nk='';c.f.forEach(f=>{if('cd'.includes(f[2]))return;let v=$('#f_'+f[0]).value.trim();if(f[2]=='x'&&v=='__new'){v=$('#kn').value.trim();if(!v)er.push('Nama kategori baru wajib diisi');else nk=v}if(f[3]&&!v)er.push(f[1]+' wajib diisi');if('nm'.includes(f[2])){v=+v;if(isNaN(v)||v<0)er.push(f[1]+' harus angka ≥ 0')}n[f[0]]=v});
if(!e&&DB[m].some(r=>r[key(m)]==n[key(m)]))er.push('Kode / ID sudah digunakan');if(er.length)return pop(er.map(x=>'• '+x).join('<br>'),null,0,'Kesalahan Input');
pop('Simpan data ini?',()=>{if(nk&&!DB.opts.kategori.some(o=>o.toLowerCase()==nk.toLowerCase()))DB.opts.kategori.push(nk);if('upd' in(DB[m][0]||{'upd':1})||m=='bibit'||m=='kemasan')n.upd=now();if(e)Object.assign(e,n);else DB[m].push(n);save();pop('Data berhasil disimpan.',()=>crud(m),0,'Berhasil')},1,'Verifikasi Simpan')}}
// transaksi
function bulk(m,R){const c=F[m];if(!R.length)return pop('Tidak ada data pada hasil filter saat ini.',null,0,'Informasi');
const fs=c.f.filter(f=>'cd'.indexOf(f[2])<0&&f[0]!=key(m));
modal(`<h3 style="margin-top:0">Edit Massal ${c.t}</h3><div>Berlaku untuk <b>${R.length}</b> data hasil filter / pencarian saat ini. Centang kolom yang ingin diubah.</div>`+fs.map(f=>`<label style="color:var(--t);margin-top:10px"><input type="checkbox" class="bk" value="${f[0]}" style="width:auto"> ${f[1]}</label>`+(f[2]=='s'?`<select id="b_${f[0]}">${f[4].map(o=>`<option>${o}</option>`).join('')}</select>`:f[2]=='x'?`<select id="b_${f[0]}">${DB.opts.kategori.map(o=>`<option>${esc(o)}</option>`).join('')}<option value="__new">+ Tambah kategori baru...</option></select><input id="kn" placeholder="Nama kategori baru" style="display:none;margin-top:4px">`:'nm'.includes(f[2])?`<div style="display:flex;gap:6px"><select id="o_${f[0]}" style="width:40%"><option value="set">Ganti jadi</option><option value="add">Tambah</option><option value="sub">Kurangi</option></select><input id="b_${f[0]}" type="number" min="0"></div>`:`<input id="b_${f[0]}">`)).join('')+`<div class="row"><button onclick="cl()">Batal</button><button class="p" id="bs">Terapkan</button></div>`);
const bx=$('#b_kategori');if(bx)bx.onchange=()=>$('#kn').style.display=bx.value=='__new'?'block':'none';
$('#bs').onclick=()=>{const ch=[...document.querySelectorAll('.bk:checked')].map(x=>x.value),er=[],ch2={};if(!ch.length)return pop('Centang minimal satu kolom yang akan diubah.',null,0,'Kesalahan Input');
ch.forEach(k=>{const f=c.f.find(x=>x[0]==k);let v=$('#b_'+k).value.trim();if(f[2]=='x'&&v=='__new'){v=$('#kn').value.trim();if(!v)er.push('Nama kategori baru wajib diisi')}
if('nm'.includes(f[2])){if(v===''||isNaN(+v)||+v<0)er.push(f[1]+' harus angka ≥ 0');ch2[k]={op:$('#o_'+k).value,v:+v}}else{if(f[3]&&!v)er.push(f[1]+' wajib diisi');ch2[k]={op:'set',v}}});
const nv=(r,k,o)=>o.op=='set'?o.v:o.op=='add'?r[k]+o.v:r[k]-o.v;
if(!er.length)R.forEach(r=>Object.entries(ch2).forEach(([k,o])=>{if(typeof o.v=='number'&&nv(r,k,o)<0)er.push(`${r.kode}: ${c.f.find(x=>x[0]==k)[1]} menjadi negatif`)}));
